<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LexiFlow — Your Personal English Coach</title>
<style>
/* ===== THEME & BASE ===== */
:root{--bg:#f4f6f3;--c:#fff;--t:#1c2a26;--m:#62706b;--a:#0f766e;--b:#dde4e0;--ok:#15803d;--no:#dc2626}
[data-theme=dark]{--bg:#0e1614;--c:#16221f;--t:#e6efec;--m:#9bb0aa;--a:#5eead4;--b:#263632;--ok:#4ade80;--no:#f87171}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Georgia,"Iowan Old Style",serif;background:var(--bg);color:var(--t)}
button,select,input,textarea,nav,.tag,.mut,.num{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input,textarea{font-size:.95rem;color:inherit}
header{background:var(--c);border-bottom:1px solid var(--b);padding:10px 16px;position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:1.25rem}.brand small{color:var(--m);font-weight:400;font-size:.8rem}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:6px}
nav button,.btn,select,input,textarea{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:7px 12px}
button{cursor:pointer}nav button{white-space:nowrap}
nav .on,.btn.p{background:var(--a);color:#fff;border-color:var(--a)}
[data-theme=dark] nav .on,[data-theme=dark] .btn.p{color:#04201c}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:.2em 0 .4em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.box,.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.card{text-align:left;transition:transform .15s,box-shadow .15s;margin:0}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px #0002}
.num{font-size:1.8rem;font-weight:700}.mut{color:var(--m)}
.tag{font-size:.75rem;background:var(--b);border-radius:99px;padding:1px 8px;margin-right:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bar{height:10px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.good{border-color:var(--ok)!important;border-width:2px!important}.bad{border-color:var(--no)!important;border-width:2px!important}
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;line-height:1.1}
.cloud button{background:none;border:0;color:var(--a);padding:2px;font-family:Georgia,serif}
.wk{display:flex;gap:6px;align-items:flex-end;height:80px}
.wk div{flex:1;background:var(--a);border-radius:4px 4px 0 0;min-height:2px}
dialog{max-width:520px;width:92%;border:1px solid var(--b);border-radius:14px;background:var(--c);color:var(--t)}
dialog::backdrop{background:#0007}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:9}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="brand">LexiFlow <small>Your Personal English Coach</small></div><nav id="nav" aria-label="Main"></nav></header>
<main id="main"></main>
<dialog id="dlg" aria-label="Word details"></dialog>
<div id="toast" role="status"></div>
<script>
/* ===== SEED DATA (term|meaning|example|category|level B/I/A|hindi|note) ===== */
const WORDS=`candid|honest and direct, even when it is uncomfortable|She gave a candid answer about why the project failed.|interview|I|स्पष्टवादी
reluctant|not willing to do something|He was reluctant to share his salary expectations.|emotion|I|अनिच्छुक
thorough|careful and complete, with attention to detail|Please do a thorough check before sending the report.|work|B|संपूर्ण
ambiguous|having more than one possible meaning|The email was ambiguous, so I asked for clarification.|business|I|अस्पष्ट
mitigate|to make something less serious or harmful|We hired extra staff to mitigate the risk of delays.|business|A|कम करना
leverage|to use something you have to gain an advantage|You can leverage your teaching experience in this role.|business|A|
feasible|possible and practical to do|Is it feasible to finish the work by Friday?|meeting|I|संभव
diligent|careful and hardworking|She is a diligent student who never skips revision.|personality|I|मेहनती
concise|clear and short, with no extra words|Keep your answer concise in the interview.|interview|I|संक्षिप्त
resilient|able to recover quickly from difficulty|Resilient people learn from failure and move on.|personality|I|लचीला
procrastinate|to delay doing something you should do|I procrastinate when a task feels too big.|daily|I|टालमटोल करना
collaborate|to work together with others|Our teams collaborate closely on every product launch.|work|B|सहयोग करना
revenue|the total money a business earns from sales|Company revenue grew by ten percent this year.|business|I|राजस्व
budget|a plan for how much money you will spend|We are working with a tight budget this quarter.|business|B|बजट
invoice|a bill listing goods or services and the money owed|I will send you the invoice by tomorrow morning.|business|B|चालान
stakeholder|a person or group affected by a decision or project|Every stakeholder should approve the plan before launch.|meeting|A|
benchmark|a standard used to compare performance|We use last year's sales as a benchmark.|business|A|
elaborate|to explain something in more detail|Could you elaborate on your second point?|meeting|I|विस्तार से बताना
plausible|reasonable and likely to be true|That sounds like a plausible explanation for the delay.|academic|I|
humble|not proud; modest about your achievements|Despite his success, he stays humble.|personality|B|विनम्र
ambitious|having a strong wish to succeed|She is ambitious and wants to lead a team soon.|personality|B|महत्वाकांक्षी
ubiquitous|seeming to be everywhere at once|Smartphones are ubiquitous in modern life.|academic|A|
meticulous|very careful about small details|He is meticulous about checking every number.|work|A|
overwhelmed|feeling that there is too much to handle|I feel overwhelmed when my inbox has hundreds of emails.|emotion|B|`;
const PHR=`carry out|to perform or complete a task|We will carry out a customer survey next week.|work|I||separable, transitive
figure out|to understand or solve something|I can't figure out why the app keeps crashing.|daily|B|समझ लेना|separable, transitive
bring up|to mention a topic (also: to raise a child)|Don't bring up salary in the first meeting.|meeting|I||separable, transitive; two meanings: mention / raise a child
look into|to investigate|The manager will look into your complaint.|work|I|जांच करना|inseparable, transitive
put off|to delay until later|Don't put off your revision until the last day.|daily|B|टालना|separable, transitive
come across|to find or meet by chance|I often come across new words while reading.|daily|I||inseparable, transitive
deal with|to handle a situation or person|She knows how to deal with difficult customers.|work|B||inseparable, transitive
follow up|to take further action after earlier contact|I will follow up with you after the call.|business|I||separable, transitive
work out|to solve; to exercise; to end well|Let's work out a plan that suits everyone.|daily|B||separable; several meanings
back up|to support, or to save a copy|Please back up your files before updating.|work|B||separable, transitive
set up|to arrange or establish|We need to set up a meeting with the client.|work|B||separable, transitive
call off|to cancel|They had to call off the event because of rain.|daily|B||separable, transitive
take on|to accept responsibility or work|I can take on another project this month.|work|I||separable, transitive
run out of|to use all of something|We are about to run out of time.|daily|B||inseparable, transitive
go over|to review carefully|Let's go over the agenda before the meeting.|meeting|B||inseparable, transitive
point out|to draw attention to something|Can I point out a small mistake in the slide?|meeting|B||separable, transitive
turn down|to refuse an offer|He decided to turn down the job offer.|interview|B||separable, transitive
step down|to leave a position|The CEO will step down next year.|business|I||intransitive`;
const IDM=`break the ice|to help people relax at the start of a conversation|A quick joke helped break the ice.|social|B|बातचीत शुरू करना|formality: informal
once in a blue moon|very rarely|I eat fast food once in a blue moon.|daily|B|कभी-कभार|formality: informal
on the same page|in agreement or sharing the same understanding|Let's confirm we are on the same page before we start.|meeting|B||formality: neutral
a blessing in disguise|something that seems bad but turns out good|Losing that job was a blessing in disguise.|daily|I||formality: neutral
hit the nail on the head|to describe exactly what is true|You hit the nail on the head with that comment.|meeting|I||formality: informal
the ball is in your court|it is your turn to act or decide|I've sent my offer, so the ball is in your court.|business|I||formality: neutral
under the weather|slightly ill|I'm feeling under the weather today.|daily|B|तबीयत ठीक नहीं|formality: informal
call it a day|to stop working for the day|It's late, so let's call it a day.|work|B||formality: informal
get the ball rolling|to start a process|Let's get the ball rolling with a quick brainstorm.|meeting|I||formality: neutral
cut corners|to do something cheaply or carelessly|We should never cut corners on safety.|business|I||formality: neutral
a piece of cake|something very easy|The test was a piece of cake.|daily|B|बहुत आसान|formality: informal
back to the drawing board|time to start again after a failed plan|The client rejected it, so it's back to the drawing board.|business|I||formality: neutral
touch base|to contact someone briefly|Let's touch base on Monday.|business|I||formality: informal to neutral
bite the bullet|to do something unpleasant you cannot avoid|I decided to bite the bullet and ask for feedback.|daily|I||formality: informal
read between the lines|to understand a hidden meaning|If you read between the lines, he is unhappy.|social|I||formality: neutral
the last straw|the final problem that makes you lose patience|Being late again was the last straw.|work|I||formality: neutral`;
const COL=`make a decision|to choose after thinking|We need to make a decision by Friday.|work|B
take responsibility|to accept that something is your duty or fault|Leaders must take responsibility for their mistakes.|work|I
meet a deadline|to finish by the required time|She worked late to meet a deadline.|work|B
raise a concern|to mention a worry politely|I'd like to raise a concern about the schedule.|meeting|I
reach an agreement|to decide together after discussion|We hope to reach an agreement today.|business|I
pay attention|to listen or watch carefully|Please pay attention to the instructions.|daily|B
strong argument|a convincing reason or case|She presented a strong argument for remote work.|academic|I
give feedback|to share opinions on someone's work|Could you give feedback on my draft?|work|B
do research|to study a subject to find facts|I need to do research before the meeting.|academic|B
set a goal|to decide what you want to achieve|Set a goal for each week.|daily|B
take a break|to rest briefly|Let's take a break for ten minutes.|daily|B
heavy traffic|a lot of vehicles on the road|I was late because of heavy traffic.|daily|B`;
const PAT=`In my opinion, ...|gives your view politely|In my opinion, we should launch next month.|opinion|I
I see your point, but ...|disagrees politely|I see your point, but the budget is limited.|disagree|I
That's a good point.|agrees politely|That's a good point; I hadn't considered the cost.|agree|B
Could you elaborate on ...?|asks for more detail|Could you elaborate on the second step?|question|I
What if we ...?|suggests an idea softly|What if we moved the meeting to Tuesday?|suggest|B
I'd suggest that we ...|makes a formal suggestion|I'd suggest that we review the data first.|suggest|I
To put it simply, ...|explains an idea simply|To put it simply, we need more time.|explain|I
Let me clarify ...|makes your meaning clear|Let me clarify what I meant by flexible.|explain|I
I was wondering if you could ...|makes a very polite request|I was wondering if you could send me the report.|professional|I
As far as I'm concerned, ...|states a personal view|As far as I'm concerned, quality comes first.|opinion|I
Would you mind ...?|asks politely for a favour|Would you mind closing the window?|professional|B`;
const T={word:'Word',phr:'Phrasal verb',idm:'Idiom',col:'Collocation',pat:'Sentence pattern'};
const LV={B:'Beginner',I:'Intermediate',A:'Advanced'};
const parse=(t,s)=>s.trim().split('\n').map((r,i)=>{const a=r.split('|');return{id:t+i,t,w:a[0],m:a[1],e:a[2],c:a[3]||'general',l:a[4]||'I',h:a[5]||'',p:a[6]||''}});
const SEED=[].concat(parse('word',WORDS),parse('phr',PHR),parse('idm',IDM),parse('col',COL),parse('pat',PAT));

/* ===== SYNONYM CLOUD DATA (headword|synonym:short meaning|...) ===== */
const SYN=`happy|glad:pleased about something specific|cheerful:showing happiness in manner|content:quietly satisfied|delighted:very pleased|elated:extremely happy, often after good news|thrilled:very excited and happy|joyful:full of joy
sad|unhappy:not happy|down:slightly sad (informal)|gloomy:sad and without hope|heartbroken:deeply sad after a loss|melancholy:a thoughtful, lasting sadness|miserable:very unhappy|upset:sad or worried by something
angry|annoyed:slightly angry|furious:extremely angry|irritated:bothered and impatient|livid:extremely angry (very strong)|outraged:angry about something unfair|cross:mildly angry (British)|resentful:angry about past unfair treatment
big|huge:very large|enormous:much larger than normal|massive:large and heavy or important|vast:very wide in area|substantial:large in amount (formal)|significant:large enough to matter
small|tiny:extremely small|compact:small and well organised|minor:not important|modest:not large in size or amount|petite:small and slim (for people)|minimal:the smallest possible
good|excellent:extremely good|superb:of the highest quality|decent:acceptable, fairly good|outstanding:far better than others|favourable:helpful and positive|satisfactory:good enough
bad|poor:low quality|awful:very bad|dreadful:extremely bad|inferior:lower in quality|unfavourable:negative, not helpful|substandard:below the required level
smart|intelligent:good at learning and thinking|bright:quick to learn|clever:quick at finding solutions|sharp:quick and accurate in thinking|knowledgeable:knowing a lot|insightful:seeing deep meaning
tired|exhausted:completely without energy|drained:emptied of energy|weary:tired from long effort|sleepy:ready to sleep|fatigued:very tired (formal)|worn out:tired after hard work
important|crucial:extremely important for the result|essential:absolutely necessary|vital:necessary for life or success|significant:having a clear effect|key:most important|critical:needed or serious
say|state:say formally or clearly|mention:say briefly|declare:announce firmly|claim:say it is true without proof|remark:make a comment|explain:make something clear
look at|glance:look quickly|stare:look for a long time|observe:watch carefully|inspect:examine closely|scan:look quickly for information|glimpse:see for a very short time
help|assist:help with a task (formal)|support:give help or encouragement|aid:give practical help|back:support publicly|facilitate:make something easier|collaborate:work together
begin|start:the most common word|commence:begin (formal)|launch:start something new|initiate:cause to begin|kick off:start (informal)|embark on:start a long project
end|finish:complete|conclude:end formally|wrap up:finish (informal)|terminate:end officially|complete:finish all parts|cease:stop
show|display:put where it can be seen|demonstrate:show how it works|reveal:make known|illustrate:explain with examples|indicate:point to|present:show formally
difficult|hard:needs effort|challenging:difficult in a stimulating way|tough:hard to deal with|demanding:needs a lot of effort|complex:having many parts|tricky:needing care
fast|quick:taking little time|rapid:happening very quickly|swift:quick and smooth|brisk:quick and energetic|prompt:without delay|speedy:fast (often informal)
slow|gradual:happening little by little|sluggish:moving or working with little energy|leisurely:unhurried and relaxed|delayed:later than planned|steady:regular, without sudden change|unhurried:not rushed`
.trim().split('\n').map(r=>{const a=r.split('|');return{h:a[0],s:a.slice(1).map(x=>{const i=x.indexOf(':');return{w:x.slice(0,i),m:x.slice(i+1)}})}});

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s);
const h=(t,a,...k)=>{const e=document.createElement(t);for(const n in a||{}){const v=a[n];if(n.slice(0,2)=='on')e.addEventListener(n.slice(2),v);else if(n=='class')e.className=v;else if(n=='value')e.value=v;else if(v!==false&&v!=null)e.setAttribute(n,v)}k.flat(9).forEach(c=>{if(c!==false&&c!=null)e.append(c instanceof Node?c:String(c))});return e};
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
const sel=(o,fn,v)=>h('select',{onchange:e=>fn(e.target.value)},o.map(([k,l])=>h('option',{value:k,selected:k==v},l)));

/* ===== STORAGE ===== */
const KEY='lexiflow_v1';let S;
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 S=Object.assign({p:{},custom:[],log:{},quiz:[],cat:{},set:{},daily:null,seen:[]},d||{});S.set=Object.assign({goal:10,hindi:true,theme:'light',qn:10},S.set)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save: browser storage is unavailable.')}}
const all=()=>SEED.concat(S.custom);
const P1=x=>S.p[x.id]||{};
const gp=id=>S.p[id]||(S.p[id]={n:0,wr:0,iv:0,ez:2.5,h:[]});
const due=x=>{const p=P1(x);return !!p.due&&p.due<=ymd()};
const L=()=>S.log[ymd()]||{l:0,r:0,q:0};
function act(k){const d=ymd(),o=S.log[d]=S.log[d]||{l:0,r:0,q:0};o[k]++}
function streaks(){const ks=Object.keys(S.log).filter(k=>{const o=S.log[k];return o.l+o.r+o.q>0}).sort();let best=0,run=0,prev=null;
 ks.forEach(k=>{run=prev&&addD(prev,1)==k?run+1:1;best=Math.max(best,run);prev=k});
 let cur=0,d=ks.includes(ymd())?ymd():addD(ymd(),-1);while(ks.includes(d)){cur++;d=addD(d,-1)}return[cur,best]}

/* ===== DAILY 3 NEW WORDS =====
 Picked once per day (saved, so a refresh shows the same three), from words you have not learned
 and have not been shown before. When every word has been shown, the cycle restarts. */
function todays(){const t=ymd();
 if(!S.daily||S.daily.d!=t||!Array.isArray(S.daily.ids)||S.daily.ids.length<3){
  const fresh=()=>all().filter(x=>x.t=='word'&&!P1(x).lr&&!S.seen.includes(x.id));
  let pool=fresh();if(pool.length<3){S.seen=[];pool=fresh()}
  if(pool.length<3)pool=all().filter(x=>!P1(x).lr);
  let sd=[...t].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);const rnd=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const ids=pool.slice(0,3).map(x=>x.id);S.daily={d:t,ids};S.seen=S.seen.concat(ids);save()}
 return S.daily.ids.map(id=>all().find(x=>x.id==id)).filter(Boolean)}
const markL=x=>{const p=gp(x.id);if(!p.lr){p.lr=1;p.at=ymd();p.iv=p.iv||1;p.due=p.due||addD(ymd(),1);act('l');save()}};

/* ===== SPACED REPETITION (simplified SM-2) =====
 Again: due today again, ease -0.2 | Hard: interval x1.2, ease -0.15
 Good: 1 day first, then interval x ease | Easy: 3 days first, then interval x ease x1.3, ease +0.15
 Saved per item: interval (iv), ease (ez), due, history (h), mistakes (wr).
 "Learned" = marked by you, or graded Good/Easy once. "Mastered" = interval >= 21 days.
 This schedules reviews; it does not guarantee permanent memory. Opening a card is never counted. */
function grade(id,g){const p=gp(id),t=ymd();
 if(g==0){p.iv=0;p.ez=Math.max(1.3,p.ez-.2);p.wr++;p.due=t}
 else{if(g==1){p.iv=Math.max(1,p.iv*1.2);p.ez=Math.max(1.3,p.ez-.15)}
  else if(g==2)p.iv=p.iv<1?1:p.iv*p.ez;else{p.iv=p.iv<1?3:p.iv*p.ez*1.3;p.ez+=.15}
  p.iv=Math.max(1,Math.round(p.iv));p.due=addD(t,p.iv)}
 p.n++;p.h.push([t,g]);p.h=p.h.slice(-20);act('r');
 if(g>=2&&!p.lr){p.lr=1;p.at=t;act('l')}}

/* ===== WORD DETAIL DIALOG ===== */
function openW(x){const d=$('#dlg');
 const draw=()=>{const q=P1(x),ta=h('textarea',{rows:2,style:'width:100%',placeholder:'Write your own sentence with "'+x.w+'"',value:q.my||''});
  d.replaceChildren(h('h2',{},x.w),
   h('p',{},h('span',{class:'tag'},T[x.t]),h('span',{class:'tag'},LV[x.l]||x.l),h('span',{class:'tag'},x.c)),
   h('p',{},x.m),S.set.hindi&&x.h?h('p',{class:'mut'},'Hindi: '+x.h):null,
   x.e?h('p',{},'“'+x.e+'”'):null,x.p?h('p',{class:'mut'},x.p):null,(()=>{const g=SYN.find(g=>g.h==x.w.toLowerCase()||g.s.some(s=>s.w==x.w.toLowerCase()));return g?h('p',{class:'mut'},'Related words: '+[g.h,...g.s.map(s=>s.w)].filter(w=>w!=x.w.toLowerCase()).join(', ')):null})(),
   h('b',{},'Use it today'),ta,
   h('div',{class:'row'},
    h('button',{class:'btn',onclick:()=>{const v=ta.value.trim();if(!v)return toast('Write a sentence first.');gp(x.id).my=v;save();toast(v.toLowerCase().includes(x.w.toLowerCase())?'Sentence saved.':'Saved, but it does not contain the exact term.')}},'Save sentence'),
    h('button',{class:'btn',onclick:()=>{gp(x.id).bm=!q.bm;save();draw()}},q.bm?'★ Bookmarked':'☆ Bookmark'),
    h('button',{class:'btn',onclick:()=>{const p=gp(x.id);if(p.lr)p.lr=0;else{p.lr=1;p.at=ymd();p.iv=p.iv||1;p.due=p.due||addD(ymd(),1);act('l')}save();draw()}},q.lr?'✓ Learned (undo)':'Mark learned'),
    h('button',{class:'btn p',onclick:()=>d.close()},'Close')))};
 draw();d.showModal()}
$('#dlg').addEventListener('close',()=>{if(V=='home')render()});

/* ===== VIEWS ===== */
let V='home',Q=null,R=null,ED=null;
const NAV=[['home','Dashboard'],['lib','Library'],['rev','Review'],['quiz','Quiz'],['cloud','Word clouds'],['mine','My words'],['set','Settings']];
function render(){document.documentElement.dataset.theme=S.set.theme;
 $('#nav').replaceChildren(...NAV.map(([k,l])=>h('button',{class:k==V?'on':'','aria-current':k==V?'page':null,onclick:()=>{V=k;Q=null;R=null;ED=null;render()}},l)));
 $('#main').replaceChildren(VIEWS[V]());window.scrollTo(0,0)}

function home(){const it=all(),t=ymd(),lg=L(),[cs,bs]=streaks(),g=S.set.goal;
 const qn=S.quiz.reduce((a,q)=>a+q.n,0),qo=S.quiz.reduce((a,q)=>a+q.s,0);
 const ws=it.filter(x=>x.t=='word'),wod=ws[[...t].reduce((a,c)=>a+c.charCodeAt(0),0)%ws.length];

const stat=(x,s)=>{const p=P1(x);return !s||(s=='new'&&!p.lr)||(s=='lrn'&&p.lr)||(s=='bm'&&p.bm)||(s=='due'&&due(x))||(s=='hard'&&p.wr>0)};

function mkQ(it){const pool=all().filter(x=>x.t==it.t&&x.id!=it.id),op=sh(pool.length>=3?pool:all().filter(x=>x.id!=it.id)).slice(0,3),i=it.e?it.e.toLowerCase().indexOf(it.w.toLowerCase()):-1;
 if(i>=0&&Math.random()<.5)return{it,q:'Complete the sentence: '+it.e.slice(0,i)+'_____'+it.e.slice(i+it.w.length),o:sh([it,...op]).map(x=>x.w),a:it.w};

function quiz(){

  h('div',{class:'row'},[5,10,20].map(n=>h('button',{class:'btn p',onclick:()=>{Q={qs:sh(all()).slice(0,n).map(mkQ),i:0,sc:0,wrong:[],ans:null};render()}},n+' questions'))));

  Q.ans!=null?h('div',{'aria-live':'polite'},h('p',{},(ok?'Correct. ':'Not quite. ')+q.it.w+' — '+q.it.m),q.it.e?h('p',{class:'mut'},'Example: '+q.it.e):null,
   h('button',{class:'btn p',onclick:()=>{Q.i++;Q.ans=null;if(Q.i>=Q.qs.length){S.quiz.push({d:ymd(),n:Q.qs.length,s:Q.sc});save()}render()}},Q.i+1>=Q.qs.length?'See results':'Next')):null)}

/* Optional online lookup (free Datamuse API, no key). Used only for words without a built-in group.
 Level filter: word frequency 1-70 per million words is used as a proxy for intermediate vocabulary
 (very common and very rare words are dropped). It is an approximation, not an official CEFR level. */
async function online(v){const q=encodeURIComponent(v),u='https://api.datamuse.com/words?md=df&max=60&';
 const [a,b]=await Promise.all([fetch(u+'rel_syn='+q).then(r=>r.json()),fetch(u+'ml='+q).then(r=>r.json())]);
 const seen=new Set([v]),rows=[];
 (Array.isArray(a)?a:[]).concat(Array.isArray(b)?b:[]).forEach(o=>{if(!o||typeof o.word!='string'||seen.has(o.word)||!/^[a-z][a-z -]*$/.test(o.word))return;seen.add(o.word);
  const f=parseFloat(((o.tags||[]).find(t=>t.startsWith('f:'))||'f:0').slice(2)),d=(o.defs||[])[0];rows.push({w:o.word,f,m:d?d.replace('\t',': '):''})});
 const mid=rows.filter(r=>r.f>=1&&r.f<=70);return(mid.length>=5?mid:rows.filter(r=>r.f>=.3)).slice(0,14)}
function synCloud(){let cur=SYN[0],pick=null;
 const chips=h('div',{class:'row'}),out=h('div'),note=h('p',{class:'mut','aria-live':'polite'});
 const lib=w=>all().find(x=>x.w.toLowerCase()==w.toLowerCase());
 const draw=()=>{chips.replaceChildren(...SYN.map(g=>h('button',{class:'btn'+(g==cur?' p':''),onclick:()=>{cur=g;pick=null;draw()}},g.h)));
  const it=pick&&lib(pick.w);
  out.replaceChildren(h('div',{class:'cloud',style:'justify-content:center;padding:14px'},h('b',{style:'font-size:2.2rem'},cur.h),
   cur.s.map(s=>h('button',{'aria-pressed':pick==s?'true':'false',style:'font-size:1.35rem'+(pick==s?';text-decoration:underline':''),onclick:()=>{pick=s;draw()}},s.w))),
   pick?h('div',{class:'row'},h('span',{},h('b',{},pick.w),pick.m?' — '+pick.m:' — no short meaning available'),it?h('button',{class:'btn',onclick:()=>openW(it)},'Open full card'):null):h('p',{class:'mut'},'Tap a word to see how it differs from "'+cur.h+'".'))};
 let tk=0,tm;
 const go=(v,now)=>{v=v.trim().toLowerCase().replace(/\s+/g,' ');clearTimeout(tm);const my=++tk;if(!v){note.textContent='';return}
  const g=SYN.find(g=>g.h==v||g.s.some(s=>s.w.toLowerCase()==v));
  if(g){cur=g;pick=g.s.find(s=>s.w.toLowerCase()==v)||null;note.textContent='';draw();return}
  if(!/^[a-z][a-z' -]{0,30}$/.test(v)){note.textContent='Type one English word using letters only.';return}
  note.textContent='Looking up related words…';
  tm=setTimeout(()=>online(v).then(r=>{if(my!=tk)return;if(r.length){cur={h:v,s:r};pick=null;note.textContent='Intermediate-level related words from an online lookup, closest first.';draw()}else note.textContent='No related words found for "'+v+'".'}).catch(()=>{if(my==tk)note.textContent='Could not reach the online lookup. Check your connection, or pick one of the built-in words below.'}),now?0:450)};
 const w=h('div',{class:'box'},h('h2',{},'Synonym cloud'),h('p',{class:'mut'},'Type any English word to see a cloud of related intermediate-level words, or choose one of the built-in words below.'),
  h('input',{type:'search','aria-label':'Find a word',placeholder:'Type any word, e.g. slow…',oninput:e=>go(e.target.value),onkeydown:e=>{if(e.key=='Enter')go(e.target.value,true)}}),note,chips,out,
  h('p',{class:'mut'},'Word size here is only for readability; it carries no statistic.'));
 draw();return w}
function cloud(){let k='all',s='';
 const F={all:()=>true,biz:x=>x.c=='business',daily:x=>x.c=='daily',bm:x=>P1(x).bm,hard:x=>P1(x).wr>0,due:due};
 const defs=[['all','All vocabulary'],['biz','Business & finance'],['daily','Daily conversation'],['bm','Bookmarked'],['rec','Recently learned'],['hard','Difficult'],['due','Due for revision']];
 const out=h('div',{class:'cloud'});
 const draw=()=>{let r=all();r=k=='rec'?r.filter(x=>P1(x).lr).sort((a,b)=>(P1(b).at||'')>(P1(a).at||'')?1:-1).slice(0,25):r.filter(F[k]);
  r=r.filter(x=>!s||x.w.toLowerCase().includes(s));
  out.replaceChildren(...(r.length?r.map(x=>h('button',{style:'font-size:'+(14+Math.min(1+(P1(x).wr||0)*2+(due(x)?1:0),8)*3)+'px',onclick:()=>openW(x)},x.w)):[h('p',{class:'mut'},'No words here yet. Bookmark, learn or practise words to fill this cloud.')]))};
 const w=h('div',{class:'box'},h('h2',{},'Learning-progress clouds'),
  h('div',{class:'row'},sel(defs,v=>{k=v;draw()},k),h('input',{type:'search','aria-label':'Search words',placeholder:'Search list…',oninput:e=>{s=e.target.value.toLowerCase();draw()}})),out,
  h('p',{class:'mut'},'Bigger word = more wrong answers or due for review. Words you have not practised stay small; nothing is estimated. Every word is a button, so the cloud works as a searchable list too.'));

function mine(){const cur=ED&&S.custom.find(c=>c.id==ED),f=Object.assign({t:'word',w:'',m:'',e:'',c:'custom',l:'I',h:''},cur||{});

function exp(){const b=new Blob([JSON.stringify({app:'lexiflow',v:1,p:S.p,custom:S.custom,log:S.log,quiz:S.quiz,cat:S.cat},null,1)],{type:'application/json'}),a=h('a',{href:URL.createObjectURL(b),download:'lexiflow-backup-'+ymd()+'.json'});document.body.append(a);a.click();a.remove()}
function imp(file){const r=new FileReader();r.onerror=()=>toast('Could not read the file.');r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.app!='lexiflow'||!Array.isArray(d.custom))throw 0;
 const ex=new Set(all().map(x=>x.t+'|'+x.w.toLowerCase())),ids=new Set(all().map(x=>x.id));let a=0,s=0;
 d.custom.forEach(c=>{const key=c&&T[c.t]&&typeof c.w=='string'?c.t+'|'+c.w.toLowerCase():null;
  if(c&&key&&typeof c.m=='string'&&c.w&&c.w.length<200&&!ex.has(key)){let id=/^c[a-z0-9]+$/.test(c.id)&&!ids.has(c.id)?c.id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
   ids.add(id);ex.add(key);S.custom.push({id,t:c.t,w:c.w,m:c.m,e:String(c.e||''),c:String(c.c||'custom'),l:LV[c.l]?c.l:'I',h:String(c.h||''),p:''});a++}else s++});
 if(d.p&&typeof d.p=='object')for(const k in d.p)if(ids.has(k)&&!S.p[k]&&d.p[k]&&typeof d.p[k]=='object')S.p[k]=d.p[k];
 if(d.log&&typeof d.log=='object')for(const k in d.log)if(!S.log[k]&&d.log[k]&&typeof d.log[k]=='object')S.log[k]={l:+d.log[k].l||0,r:+d.log[k].r||0,q:+d.log[k].q||0};
